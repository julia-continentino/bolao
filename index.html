<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bolão Copa 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f0f0f0;min-height:100vh}
.header{background:#006233;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:50%;background:#FEDD00;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header-title{color:#FEDD00;font-weight:700;font-size:17px}
.header-sub{color:rgba(255,255,255,0.75);font-size:12px}

.nav button.active{background:#FEDD00;color:#006233;border-color:#FEDD00}
.container{padding:20px;max-width:720px;margin:0 auto}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:16px}
.card-green{background:#006233;border:2px solid #FEDD00;border-radius:12px;padding:20px;margin-bottom:20px;text-align:center}
.card-green h1{color:#FEDD00;font-size:22px;margin-bottom:4px}
.card-green p{color:rgba(255,255,255,0.85);font-size:13px}
.section-title{font-weight:700;font-size:18px;color:#006233;margin-bottom:16px}
.btn-green{background:#006233;color:#FEDD00;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px;cursor:pointer}
.btn-blue{background:#002776;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:500}
.btn-outline{background:transparent;border:1px solid #ddd;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:#666}
.tab-btn{background:transparent;color:#333;border:1.5px solid #ddd;border-radius:8px;padding:6px 18px;font-weight:600;cursor:pointer;font-size:13px}

input,select{padding:8px 12px;border-radius:8px;border:1px solid #ddd;font-size:14px;width:100%}
select{padding:4px 6px}
.row{display:flex;gap:8px;align-items:center}
.grid-grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.grupo-card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}

.grupo-header.verde{background:#006233}

.grupo-team:last-child{border-bottom:none}
.grupo-num{color:#aaa;font-size:11px;min-width:14px}
.ranking-item{background:#fff;border:2px solid #eee;border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}

.score-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #eee}
.score-label{color:#555}

.palpite-card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:12px}
.palpite-header{background:#002776;padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
.palpite-header span{color:#FEDD00;font-weight:700}
.palpite-body{padding:10px}
.palpite-label{font-size:12px;color:#666;margin-bottom:4px}
.fase-card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:14px}
.fase-header{background:#006233;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.fase-header span{color:#FEDD00;font-weight:700}
.fase-header small{color:rgba(255,255,255,0.75);font-size:12px}
.fase-body{padding:12px;display:flex;flex-wrap:wrap;gap:8px}
.acerto{color:#16a34a;font-size:11px;text-align:center}
select.acerto-border{border-color:#22c55e}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.user-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.admin-box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;max-width:360px;margin:0 auto}
.sync-status{position:fixed;bottom:12px;right:12px;background:#fff;border:1px solid #ddd;border-radius:20px;padding:4px 12px;font-size:11px;color:#666;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:100}
.sync-status.connected{color:#16a34a}
.sync-status.connecting{color:#f59e0b}
.sync-status.error{color:#dc2626}
.locked-tag{display:inline-block;background:#dc2626;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
.deadline-tag{display:inline-block;background:#f59e0b;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
select:disabled{opacity:0.55;background:#f3f3f3;cursor:not-allowed}
.deadline-banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;text-align:center;font-weight:600}
.deadline-banner.open{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.deadline-banner.closed{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.hidden{display:none}
</style>
</head>
<body>

<div id="app"></div>
<div id="sync-status" class="sync-status connecting">⏳ Conectando...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKfutY8bMROBKQc1Hz_0ec_Bt7ZokRRp8",
  authDomain: "bolao-copa-2026-98887.firebaseapp.com",
  projectId: "bolao-copa-2026-98887",
  storageBucket: "bolao-copa-2026-98887.firebasestorage.app",
  messagingSenderId: "1064307690814",
  appId: "1:1064307690814:web:1a3ba7570dc2a915f7b06f"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const GRUPOS = {
  A:["México","África do Sul","Coreia do Sul","Rep. Tcheca"],
  B:["Canadá","Bósnia","Qatar","Suíça"],
  C:["Brasil","Marrocos","Haiti","Escócia"],
  D:["EUA","Paraguai","Austrália","Turquia"],
  E:["Alemanha","Curaçao","Costa do Marfim","Equador"],
  F:["Países Baixos","Japão","Suécia","Tunísia"],
  G:["Bélgica","Egito","Irã","Nova Zelândia"],
  H:["Espanha","Cabo Verde","Arábia Saudita","Uruguai"],
  I:["França","Senegal","Iraque","Noruega"],
  J:["Argentina","Argélia","Áustria","Jordânia"],
  K:["Portugal","RD Congo","Uzbequistão","Colômbia"],
  L:["Inglaterra","Croácia","Gana","Panamá"]
};

const ROUNDS = [
  {key:"r16",label:"16 times classificados para as oitavas",pts:2, slots:16,deadline:"2026-06-27T23:59:59-03:00"},
  {key:"r8", label:"8 times classificados para as quartas", pts:3, slots:8, deadline:"2026-07-04T12:00:00-03:00"},
  {key:"r4", label:"4 times classificados para as semis",   pts:4, slots:4, deadline:"2026-07-09T12:00:00-03:00"},
  {key:"r2", label:"2 times classificados para a final",    pts:6, slots:2, deadline:"2026-07-13T23:59:59-03:00"},
  {key:"r1", label:"Campeão",                                pts:10,slots:1, deadline:"2026-07-17T23:59:59-03:00"}
];

const GROUP_DEADLINE = "2026-06-10T23:59:59-03:00";

const ALL_TEAMS = Object.values(GRUPOS)
  .reduce((a,b)=>a.concat(b),[])
  .filter((v,i,arr)=>arr.indexOf(v)===i)
  .sort();

const LOCAL_KEY = "bolao2026_local";
const ADMIN_PWD_HASH = "b92e9172da82616564bd6b24228bc2241c78a4e18ef967a9b4b3691bc00040ce";

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

const localPrefs = loadLocalPrefs();

const state = {
  view: "home",
  tab: "grupos",
  activeParticipant: localPrefs.activeParticipant || null,
  adminUnlocked: !!localPrefs.adminUnlocked,
  loaded: { participants:false, results:false },
  data: { participants:[], results:{ groups:{}, rounds:{} } }
};

function loadLocalPrefs(){
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveLocalPrefs(){
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify({
      activeParticipant: state.activeParticipant,
      adminUnlocked: state.adminUnlocked
    }));
  } catch(e){}
}

function setSyncStatus(kind, text){
  const el = document.getElementById("sync-status");
  if (!el) return;
  el.className = "sync-status " + kind;
  el.textContent = text;
  if (kind === "connected") setTimeout(()=>{ el.style.opacity = "0.4"; }, 2000);
  else el.style.opacity = "1";
}

function isLocked(deadline){
  return new Date() > new Date(deadline);
}

function fmtDate(deadline){
  const d = new Date(deadline);
  return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"});
}

function availableForRound(roundKey, currentPick){
  let teams;
  if (roundKey === "r4"){
    const qf = state.data.results.rounds?.["r8"] || [];
    teams = qf.length === 0 ? ALL_TEAMS : qf.slice().sort((a,b)=>a.localeCompare(b));
  } else {
    teams = ALL_TEAMS;
  }
  if (currentPick && !teams.includes(currentPick)){
    teams = [currentPick, ...teams];
  }
  return teams;
}

onSnapshot(collection(db,"participants"),(snap)=>{
  const list = [];
  snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  state.data.participants = list;
  state.loaded.participants = true;
  checkLoadedAndRender();
}, (err)=>{
  console.error(err);
  setSyncStatus("error","⚠️ Erro de conexão");
});

onSnapshot(doc(db,"meta","results"),(snap)=>{
  state.data.results = snap.exists()
    ? { groups: snap.data().groups || {}, rounds: snap.data().rounds || {} }
    : { groups:{}, rounds:{} };
  state.loaded.results = true;
  checkLoadedAndRender();
}, (err)=>{
  console.error(err);
  setSyncStatus("error","⚠️ Erro de conexão");
});

function checkLoadedAndRender(){
  if (state.loaded.participants && state.loaded.results){
    setSyncStatus("connected","✅ Sincronizado");
  }
  render();
}

async function saveParticipant(p){
  try {
    setSyncStatus("connecting","💾 Salvando...");
    await setDoc(doc(db,"participants", String(p.id)), {
      name: p.name,
      pin: p.pin || "",
      palpites: p.palpites || { groups:{}, rounds:{} }
    });
    setSyncStatus("connected","✅ Salvo");
  } catch(e){
    console.error(e);
    setSyncStatus("error","⚠️ Falha ao salvar");
  }
}

async function saveResults(){
  try {
    setSyncStatus("connecting","💾 Salvando...");
    await setDoc(doc(db,"meta","results"), state.data.results);
    setSyncStatus("connected","✅ Salvo");
  } catch(e){
    console.error(e);
    setSyncStatus("error","⚠️ Falha ao salvar");
  }
}

async function removeParticipant(id){
  try {
    await deleteDoc(doc(db,"participants", String(id)));
  } catch(e){ console.error(e); }
}

function scoreGroup(p, r){
  if (!p || !r) return { points: 0, kind: "none" };
  const pf = p.first, ps = p.second;
  const rf = r.first, rs = r.second;
  if (!pf && !ps) return { points: 0, kind: "none" };
  if (!rf && !rs) return { points: 0, kind: "none" };

  if (pf && ps && rf && rs){
    if (pf === rf && ps === rs) return { points: 4, kind: "exact" };
    if (pf === rs && ps === rf) return { points: 2, kind: "inverted" };
  }
  const pSet = [pf, ps].filter(Boolean);
  const rSet = [rf, rs].filter(Boolean);
  const matches = pSet.filter(x => rSet.includes(x)).length;
  if (matches >= 1) return { points: 1, kind: "partial" };
  return { points: 0, kind: "none" };
}

function calcScore(palpites, results){
  let score = 0;
  const pg = palpites?.groups || {};
  const rg = results?.groups  || {};
  const pr = palpites?.rounds || {};
  const rr = results?.rounds  || {};

  Object.keys(GRUPOS).forEach(g => {
    score += scoreGroup(pg[g], rg[g]).points;
  });

  ROUNDS.forEach(round => {
    const pR = pr[round.key] || [], rR = rr[round.key] || [];
    pR.forEach(t => { if (rR.indexOf(t) !== -1) score += round.pts; });
  });
  return score;
}

function getParticipant(){
  if (!state.activeParticipant) return null;
  return state.data.participants.find(p => p.id === state.activeParticipant) || null;
}

function getRanking(){
  return state.data.participants
    .map(p => ({ id:p.id, name:p.name, score:calcScore(p.palpites, state.data.results) }))
    .sort((a,b)=> b.score - a.score);
}

function esc(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(){
  document.getElementById("app").innerHTML = buildPage();
  attachEvents();
}

function buildHeader(){
  const views = [["home","Início"],["grupos","Grupos"],["ranking","Ranking"],["acertos","Acertos"],["admin","Admin"]];
  const nav = views.map(v =>
    `<button class="${state.view===v[0]?"active":""}" data-nav="${v[0]}">${v[1]}</button>`
  ).join("");
  return `<div class="header">
    <div class="logo">⚽</div>
    <div><div class="header-title">Bolão Copa 2026</div><div class="header-sub">EUA · Canadá · México</div></div>
    <div class="nav">${nav}</div>
  </div>`;
}

function buildPage(){
  const header = buildHeader();
  let body = "";
  if (state.view === "home")     body = buildHome();
  if (state.view === "grupos")   body = buildGrupos();
  if (state.view === "ranking")  body = buildRanking();
  if (state.view === "acertos")  body = buildAcertos();
  if (state.view === "admin")    body = buildAdmin();
  if (state.view === "palpitar") body = buildPalpitar();
  return header + `<div class="container">${body}</div>`;
}

function buildHome(){
  const activeP = getParticipant();
  let activeCard = "";
  if (activeP){
    activeCard = `<div class="card-green" style="text-align:left">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">
          <div style="font-size:12px;color:rgba(255,255,255,0.85)">Continuar como</div>
          <div style="font-weight:700;color:#FEDD00;font-size:18px">${esc(activeP.name)}</div>
        </div>
        <button class="btn-green" data-continue="1" style="background:#FEDD00;color:#006233">Meus palpites →</button>
        <button id="btn-logout-home" style="background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer">Sair</button>
      </div>
    </div>`;
  } else {
    activeCard = `<div class="card-green"><h1>🏆 Bolão Copa do Mundo 2026</h1><p>Faça seus palpites e dispute com amigos!</p></div>`;
  }

  let participantsHTML = "";
  if (state.data.participants.length > 0){
    const btns = state.data.participants
      .slice()
      .sort((a,b)=> a.name.localeCompare(b.name))
      .map(p => `<button class="btn-blue" data-select="${esc(p.id)}">${esc(p.name)}${p.pin?" 🔒":""}</button>`)
      .join("");
    participantsHTML = `<div style="margin-bottom:12px"><div style="font-size:13px;color:#666;margin-bottom:8px">Já cadastrado? Selecione (vai pedir seu PIN):</div><div style="display:flex;flex-wrap:wrap;gap:8px">${btns}</div></div>`;
  }
  return activeCard + `
  <div class="card">
    <div style="font-weight:600;font-size:15px;margin-bottom:14px">Participar do bolão</div>
    ${participantsHTML}
    <div style="border-top:1px solid #eee;padding-top:12px">
      <div style="font-size:13px;color:#666;margin-bottom:8px">Novo participante:</div>
      <input id="inp-name" type="text" placeholder="Seu nome..." style="margin-bottom:8px"/>
      <input id="inp-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="PIN de 4 dígitos (anote!)" style="margin-bottom:8px"/>
      <button class="btn-green" id="btn-add" style="width:100%">Entrar</button>
      <div style="font-size:11px;color:#999;margin-top:6px">⚠️ O PIN é necessário pra você editar seus palpites depois. Anote.</div>
    </div>
  </div>
  <div class="score-bar">
    <div style="font-weight:600;font-size:14px;margin-bottom:12px">Sistema de pontuação</div>
    ${[["Acertar os 2 do grupo em ordem","4 pts"],
       ["Acertar os 2 em ordem invertida","2 pts"],
       ["Acertar apenas 1 do grupo","1 pt"],
       ["Pré-oitavas (cada time → oitavas)","2 pts"],
       ["Oitavas (cada time → quartas)","3 pts"],
       ["Quartas (cada time → semis)","4 pts"],
       ["Semifinais (cada finalista)","6 pts"],
       ["Acertar o campeão","10 pts"]]
      .map(r => `<div class="score-row"><span class="score-label">${r[0]}</span><span class="score-pts">${r[1]}</span></div>`)
      .join("")}
  </div>`;
}

function buildGrupos(){
  const cards = Object.entries(GRUPOS).map(([g, teams]) => {
    const isBrasil = g === "C";
    const teams_html = teams.map((t,i) =>
      `<div class="grupo-team"><span class="grupo-num">${i+1}.</span>${esc(t)}</div>`
    ).join("");
    return `<div class="grupo-card${isBrasil?" brasil":""}">
      <div class="grupo-header ${isBrasil?"verde":"azul"}"><span>Grupo ${g}${isBrasil?" 🇧🇷":""}</span></div>
      ${teams_html}
    </div>`;
  }).join("");
  return `<div class="section-title">Grupos da Copa 2026</div><div class="grid-grupos">${cards}</div>`;
}

function buildRanking(){
  const ranking = getRanking();
  const items = ranking.length === 0
    ? `<div style="color:#999;text-align:center;padding:40px">Nenhum participante ainda.</div>`
    : ranking.map((p,i) => {
        const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"º";
        const border = i===0?"#FEDD00":i===1?"#C0C0C0":i===2?"#CD7F32":"#eee";
        return `<div class="ranking-item" style="border-color:${border}">
          <div style="font-size:24px;min-width:36px;text-align:center">${medal}</div>
          <div style="flex:1;font-weight:600;font-size:15px">${esc(p.name)}</div>
          <div class="pts-badge">${p.score} pts</div>
        </div>`;
      }).join("");
  return `<div class="section-title">🏅 Ranking</div>${items}`;
}

function buildAcertos(){
  const ranking = getRanking();
  if (ranking.length === 0){
    return `<div class="section-title">📊 Acertos detalhados</div>
            <div style="color:#999;text-align:center;padding:40px">Nenhum participante ainda.</div>`;
  }

  const cards = ranking.map(rk => {
    const p = state.data.participants.find(x => x.id === rk.id);
    if (!p) return "";

    const pg = p.palpites?.groups || {};
    const rg = state.data.results.groups || {};
    let groupsTotal = 0;
    const groupBadges = Object.keys(GRUPOS).map(g => {
      const sr = scoreGroup(pg[g], rg[g]);
      groupsTotal += sr.points;
      if (sr.points === 0) return "";
      const sym = sr.kind === "exact" ? "✓✓" : sr.kind === "inverted" ? "⇄" : "✓";
      return `<span style="display:inline-block;background:#006233;color:#FEDD00;padding:3px 8px;border-radius:6px;margin:2px;font-size:11px;font-weight:600">${g} ${sym} +${sr.points}</span>`;
    }).join("");

    const roundsRows = ROUNDS.map(round => {
      const pp = p.palpites?.rounds?.[round.key] || [];
      const rr = state.data.results.rounds?.[round.key] || [];
      const hits = pp.filter(t => rr.includes(t));
      const pts = hits.length * round.pts;
      const teamsLine = hits.length > 0
        ? `<div style="font-size:11px;color:#16a34a;margin-top:2px">✅ ${hits.map(esc).join(", ")}</div>`
        : "";
      return `<div style="padding:6px 0;border-bottom:1px solid #f0f0f0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="color:#555;flex:1;font-size:12px">${esc(round.label)}</span>
          <span style="color:#888;font-size:11px">${hits.length}/${round.slots}</span>
          <span style="color:#006233;font-weight:700;min-width:55px;text-align:right;font-size:13px">${pts} pts</span>
        </div>
        ${teamsLine}
      </div>`;
    }).join("");

    const groupsSection = groupBadges
      ? `<div style="margin:10px 0">
          <div style="font-size:12px;color:#666;margin-bottom:4px">Grupos (${groupsTotal} pts)</div>
          <div>${groupBadges}</div>
        </div>`
      : `<div style="margin:10px 0;font-size:12px;color:#999">Grupos: nenhum acerto ainda</div>`;

    return `<div class="card" style="padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
        <div style="font-weight:700;font-size:16px">${esc(p.name)}</div>
        <div class="pts-badge">${rk.score} pts</div>
      </div>
      ${groupsSection}
      <div style="margin-top:8px">${roundsRows}</div>
    </div>`;
  }).join("");

  return `<div class="section-title">📊 Acertos detalhados</div>${cards}`;
}

function buildAdmin(){
  if (!state.adminUnlocked){
    return `<div class="admin-box">
      <div style="font-size:14px;color:#666;margin-bottom:12px">Senha de administrador:</div>
      <input id="admin-pwd" type="password" placeholder="Senha..." style="margin-bottom:12px"/>
      <button class="btn-green" id="btn-admin-login" style="width:100%;padding:10px">Entrar</button>
    </div>`;
  }

  const tabsHTML = `<div class="tabs">
    <button class="tab-btn${state.tab==="grupos"?" active":""}" data-tab="grupos">Fase de Grupos</button>
    <button class="tab-btn${state.tab==="fases"?" active":""}" data-tab="fases">Fase Final</button>
    <button class="tab-btn${state.tab==="participantes"?" active":""}" data-tab="participantes">Participantes</button>
  </div>`;

  let content = "";
  if (state.tab === "grupos"){
    const cards = Object.entries(GRUPOS).map(([g, teams]) => {
      const r = state.data.results.groups?.[g] || {};
      const opts1 = teams.map(t => `<option value="${esc(t)}"${r.first===t?" selected":""}>${esc(t)}</option>`).join("");
      const opts2 = teams.map(t => `<option value="${esc(t)}"${r.second===t?" selected":""}>${esc(t)}</option>`).join("");
      return `<div class="palpite-card">
        <div class="palpite-header"><span>Grupo ${g}</span></div>
        <div class="palpite-body">
          <div class="palpite-label">1º lugar</div>
          <select data-result-group="${g}" data-pos="first" style="margin-bottom:8px"><option value="">-- selecione --</option>${opts1}</select>
          <div class="palpite-label">2º lugar</div>
          <select data-result-group="${g}" data-pos="second"><option value="">-- selecione --</option>${opts2}</select>
        </div>
      </div>`;
    }).join("");
    content = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${cards}</div>`;
  } else if (state.tab === "fases"){
    content = ROUNDS.map(round => {
      const rr = state.data.results.rounds?.[round.key] || [];
      const selects = Array.from({length:round.slots}).map((_,i) => {
        const available = availableForRound(round.key, rr[i]);
        const opts = available.map(t => `<option value="${esc(t)}"${rr[i]===t?" selected":""}>${esc(t)}</option>`).join("");
        return `<select data-result-round="${round.key}" data-idx="${i}"><option value="">-- time --</option>${opts}</select>`;
      }).join("");
      return `<div class="fase-card">
        <div class="fase-header"><span>${round.label}</span><small>${round.pts} pts · ${round.slots} time${round.slots>1?"s":""}</small></div>
        <div class="fase-body">${selects}</div>
      </div>`;
    }).join("");
  } else {
    const list = state.data.participants
      .slice()
      .sort((a,b)=> a.name.localeCompare(b.name));
    content = list.length === 0
      ? `<div style="color:#999;text-align:center;padding:40px">Nenhum participante ainda.</div>`
      : list.map(p => `<div class="ranking-item">
          <div style="flex:1;font-weight:600">${esc(p.name)}</div>
          <button class="btn-outline" data-remove="${esc(p.id)}" style="color:#dc2626;border-color:#dc2626">Remover</button>
        </div>`).join("");
  }
  return `<div style="font-weight:700;font-size:18px;color:#006233;margin-bottom:16px">Painel Admin — Resultados Reais</div>${tabsHTML}${content}`;
}

function buildPalpitar(){
  const p = getParticipant();
  if (!p) return `<div style="padding:40px;text-align:center;color:#999">Participante não encontrado.</div>`;

  const score = calcScore(p.palpites, state.data.results);
  const userBar = `<div class="user-bar">
    <button class="btn-outline" id="btn-voltar">← Voltar</button>
    <div class="pts-badge">${esc(p.name)} — ${score} pts</div>
    <button class="btn-outline" id="btn-logout" style="margin-left:auto;color:#dc2626;border-color:#dc2626">Sair</button>
  </div>`;

  const tabsHTML = `<div class="tabs">
    <button class="tab-btn${state.tab==="grupos"?" active":""}" data-tab="grupos">Fase de Grupos</button>
    <button class="tab-btn${state.tab==="fases"?" active":""}" data-tab="fases">Fase Final</button>
  </div>`;

  let content = "";
  if (state.tab === "grupos"){
    const groupsLocked = isLocked(GROUP_DEADLINE);
    const deadlineBanner = `<div class="deadline-banner ${groupsLocked?'closed':'open'}">
      ${groupsLocked ? '🔒 Palpites de grupos encerrados em' : '⏰ Palpites de grupos até'} ${fmtDate(GROUP_DEADLINE)}
    </div>`;
    const pg = p.palpites?.groups || {};
    const cards = Object.entries(GRUPOS).map(([g, teams]) => {
      const pal = pg[g] || {};
      const rg  = state.data.results.groups?.[g] || {};
      const a1  = !!(rg.first  && pal.first  === rg.first);
      const a2  = !!(rg.second && pal.second === rg.second);
      const sr  = scoreGroup(pal, rg);
      const badge = sr.points > 0
        ? `<span style="font-size:11px;color:#FEDD00">${sr.kind==="exact"?"✓✓ +4":sr.kind==="inverted"?"⇄ +2":"✓ +1"}</span>`
        : "";
      const opts1 = teams.map(t => `<option value="${esc(t)}"${pal.first===t?" selected":""}>${esc(t)}</option>`).join("");
      const opts2 = teams.map(t => `<option value="${esc(t)}"${pal.second===t?" selected":""}>${esc(t)}</option>`).join("");
      const dis = groupsLocked ? "disabled" : "";
      return `<div class="palpite-card">
        <div class="palpite-header"><span>Grupo ${g}</span>${badge}</div>
        <div class="palpite-body">
          <div class="palpite-label">1º lugar ${a1?"✅":""}</div>
          <select data-pal-group="${g}" data-pos="first" ${dis} style="margin-bottom:8px"><option value="">-- palpite --</option>${opts1}</select>
          <div class="palpite-label">2º lugar ${a2?"✅":""}</div>
          <select data-pal-group="${g}" data-pos="second" ${dis}><option value="">-- palpite --</option>${opts2}</select>
        </div>
      </div>`;
    }).join("");
    content = deadlineBanner + `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px">${cards}</div>`;
  } else {
    const pr2 = p.palpites?.rounds || {};
    content = ROUNDS.map(round => {
      const pp  = pr2[round.key] || [];
      const rr2 = state.data.results.rounds?.[round.key] || [];
      const locked = isLocked(round.deadline);
      const lockTag = locked
        ? `<span class="locked-tag">🔒 Encerrado ${fmtDate(round.deadline)}</span>`
        : `<span class="deadline-tag">⏰ Até ${fmtDate(round.deadline)}</span>`;
      const selects = Array.from({length:round.slots}).map((_,i) => {
        const acerto = !!(pp[i] && rr2.indexOf(pp[i]) !== -1);
        const available = availableForRound(round.key, pp[i]);
        const opts = available.map(t => `<option value="${esc(t)}"${pp[i]===t?" selected":""}>${esc(t)}</option>`).join("");
        const dis = locked ? "disabled" : "";
        return `<div style="display:flex;flex-direction:column;gap:4px">
          <select data-pal-round="${round.key}" data-idx="${i}" ${dis} ${acerto?'class="acerto-border"':''}>
            <option value="">-- time --</option>${opts}
          </select>
          ${acerto?`<span class="acerto">✅ +${round.pts}</span>`:""}
        </div>`;
      }).join("");
      return `<div class="fase-card">
        <div class="fase-header"><span>${round.label}</span><small>${round.pts} pts ${lockTag}</small></div>
        <div class="fase-body">${selects}</div>
      </div>`;
    }).join("");
  }
  return userBar + tabsHTML + content;
}

function attachEvents(){
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", function(){
      state.view = this.getAttribute("data-nav");
      state.tab = "grupos";
      render();
    });
  });

  document.querySelectorAll("[data-select]").forEach(btn => {
    btn.addEventListener("click", function(){
      const id = this.getAttribute("data-select");
      const p = state.data.participants.find(x => x.id === id);
      if (!p) return;
      if (p.pin){
        const pin = window.prompt(`Digite o PIN de 4 dígitos de ${p.name}:`);
        if (pin === null) return;
        if (pin !== p.pin){ alert("PIN incorreto."); return; }
      }
      state.activeParticipant = id;
      saveLocalPrefs();
      state.view = "palpitar";
      state.tab = "grupos";
      render();
    });
  });

  document.querySelectorAll("[data-continue]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.view = "palpitar";
      state.tab = "grupos";
      render();
    });
  });

  const btnLogoutHome = document.getElementById("btn-logout-home");
  if (btnLogoutHome) btnLogoutHome.addEventListener("click", () => {
    state.activeParticipant = null;
    saveLocalPrefs();
    render();
  });

  const btnLogout = document.getElementById("btn-logout");
  if (btnLogout) btnLogout.addEventListener("click", () => {
    state.activeParticipant = null;
    saveLocalPrefs();
    state.view = "home";
    render();
  });

  const btnAdd = document.getElementById("btn-add");
  if (btnAdd) btnAdd.addEventListener("click", addParticipant);
  const inp = document.getElementById("inp-name");
  if (inp) inp.addEventListener("keydown", e => { if (e.key === "Enter") addParticipant(); });

  const btnVoltar = document.getElementById("btn-voltar");
  if (btnVoltar) btnVoltar.addEventListener("click", () => { state.view = "home"; render(); });

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", function(){ state.tab = this.getAttribute("data-tab"); render(); });
  });

  const btnLogin = document.getElementById("btn-admin-login");
  if (btnLogin) btnLogin.addEventListener("click", async () => {
    const pwd = document.getElementById("admin-pwd").value;
    const hash = await sha256(pwd);
    if (hash === ADMIN_PWD_HASH){ state.adminUnlocked = true; saveLocalPrefs(); render(); }
    else alert("Senha incorreta");
  });

  document.querySelectorAll("[data-result-group]").forEach(sel => {
    sel.addEventListener("change", function(){
      const g = this.getAttribute("data-result-group");
      const pos = this.getAttribute("data-pos");
      if (!state.data.results.groups[g]) state.data.results.groups[g] = {};
      state.data.results.groups[g][pos] = this.value;
      saveResults();
    });
  });

  document.querySelectorAll("[data-result-round]").forEach(sel => {
    sel.addEventListener("change", function(){
      const key = this.getAttribute("data-result-round");
      const idx = parseInt(this.getAttribute("data-idx"));
      if (!state.data.results.rounds[key]) state.data.results.rounds[key] = [];
      state.data.results.rounds[key][idx] = this.value;
      state.data.results.rounds[key] = state.data.results.rounds[key].filter(x => !!x);
      saveResults();
    });
  });

  document.querySelectorAll("[data-pal-group]").forEach(sel => {
    sel.addEventListener("change", function(){
      const g = this.getAttribute("data-pal-group");
      const pos = this.getAttribute("data-pos");
      const p = getParticipant();
      if (!p) return;
      if (!p.palpites) p.palpites = { groups:{}, rounds:{} };
      if (!p.palpites.groups[g]) p.palpites.groups[g] = {};
      p.palpites.groups[g][pos] = this.value;
      saveParticipant(p);
    });
  });

  document.querySelectorAll("[data-pal-round]").forEach(sel => {
    sel.addEventListener("change", function(){
      const key = this.getAttribute("data-pal-round");
      const idx = parseInt(this.getAttribute("data-idx"));
      const p = getParticipant();
      if (!p) return;
      if (!p.palpites) p.palpites = { groups:{}, rounds:{} };
      if (!p.palpites.rounds[key]) p.palpites.rounds[key] = [];
      p.palpites.rounds[key][idx] = this.value;
      p.palpites.rounds[key] = p.palpites.rounds[key].filter(x => !!x);
      saveParticipant(p);
    });
  });

  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", function(){
      const id = this.getAttribute("data-remove");
      const part = state.data.participants.find(p => p.id === id);
      if (!part) return;
      if (confirm(`Remover ${part.name}? Esta ação não pode ser desfeita.`)) removeParticipant(id);
    });
  });
}

async function addParticipant(){
  const inp = document.getElementById("inp-name");
  const pinInp = document.getElementById("inp-pin");
  if (!inp || !inp.value.trim()){ alert("Digite seu nome."); return; }
  if (!pinInp || !/^\d{4}$/.test(pinInp.value)){ alert("Digite um PIN de 4 dígitos numéricos."); return; }
  const name = inp.value.trim();
  const pin = pinInp.value;
  const existing = state.data.participants.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing){
    alert(`O nome "${name}" já está cadastrado. Selecione na lista acima e use o PIN.`);
    return;
  }
  const p = { id: String(Date.now()), name, pin, palpites: { groups:{}, rounds:{} } };
  await saveParticipant(p);
  state.activeParticipant = p.id;
  saveLocalPrefs();
  state.view = "palpitar";
  state.tab = "grupos";
  render();
}

render();
</script>
